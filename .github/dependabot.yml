# Weekly update PRs for the pinned workflow actions and the npm packages.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    ignore:
      # TypeScript majors wait until typescript-eslint and svelte-check
      # support them (2026-10: typescript-eslint <6.1, svelte-check ^5 || ^6).
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
