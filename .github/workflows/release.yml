name: Release

# Push a version tag (scripts/release.sh does it) to build the plugin and
# create a draft GitHub release with main.js, manifest.json and styles.css.
on:
  push:
    tags: ["[0-9]+.[0-9]+.[0-9]+"]

permissions: {}

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the draft release
      id-token: write # sign the attestation
      attestations: write # store the attestation
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
      - run: npm ci
      - name: Check the tag matches manifest.json and versions.json
        run: |
          version="$(node -p "require('./manifest.json').version")"
          if [ "$GITHUB_REF_NAME" != "$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match manifest.json version $version"
            exit 1
          fi
          if ! node -e "process.exit(require('./versions.json')[process.argv[1]] ? 0 : 1)" "$version"; then
            echo "::error::versions.json has no entry for $version"
            exit 1
          fi
      - run: npm run lint
      - run: npm test
      - run: npx tsc --noEmit
      - run: npm run svelte-check
      - run: npm run build
      # Attestations need a public repository (or GitHub Enterprise) on GitHub's plans.
      - if: ${{ !github.event.repository.private }}
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          --repo "$GITHUB_REPOSITORY"
          --draft
          --title "$GITHUB_REF_NAME"
          --generate-notes
          main.js manifest.json styles.css
